[project]
name = "pkz-lab"
version = "0.1.0"
description = "A playground for coding experiments and creative tinkering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.5.0",
    "PyYAML>=6.0",
    "toon-format @ git+https://github.com/toon-format/toon-python.git",
    "openai>=2.8.1",
    "dotenv>=0.9.9",
    "ipykernel>=7.1.0",
    "pandas>=2.3.3",
    "streamlit>=1.51.0",
    "matplotlib>=3.10.7",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "pkz"
